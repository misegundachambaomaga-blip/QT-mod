name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  buildWindows:
    runs-on: windows-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Instalar Haxe
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: '4.2.5'

      - name: Configurar Haxelib
        shell: cmd
        run: haxelib setup C:/haxelib

      - name: Buscar Project.xml
        id: project
        shell: pwsh
        run: |
          $project = Get-ChildItem $env:GITHUB_WORKSPACE -Filter "Project.xml" -Recurse -File |
            Where-Object { $_.FullName -notmatch '\\(\.git|node_modules)\\' } |
            Select-Object -First 1

          if ($null -eq $project) {
            Get-ChildItem $env:GITHUB_WORKSPACE -Force
            throw "No se encontro Project.xml"
          }

          "PROJECT_FILE=$($project.FullName)" >> $env:GITHUB_ENV
          "PROJECT_DIR=$($project.Directory.FullName)" >> $env:GITHUB_ENV
          Write-Host "Encontrado: $($project.FullName)"

      - name: Instalar dependencias
        shell: pwsh
        run: |
          haxelib install hxcpp
          haxelib install lime
          haxelib install openfl
          haxelib install flixel
          haxelib install flixel-tools
          haxelib install flixel-ui
          haxelib install flixel-addons
          haxelib install hscript
          haxelib install hscript-ex
          haxelib install tjson
          haxelib install hxjsonast
          haxelib install newgrounds
          haxelib install polymod
          haxelib install discord_rpc
          haxelib install hxcpp-debug-server
          haxelib git linc_luajit https://github.com/AndreiRudenko/linc_luajit
          haxelib run lime setup -y
          haxelib list

      - name: Crear version
        shell: pwsh
        run: '"${{ github.run_id }}" | Set-Content VERSION'

      - name: Compilar Windows x64
        shell: pwsh
        run: |
          Set-Location "$env:PROJECT_DIR"
          haxelib run lime build "$env:PROJECT_FILE" windows -64 --app-version="4.0.0-${{ github.run_id }}"
          if ($LASTEXITCODE -ne 0) {
            throw "La compilacion de Windows fallo."
          }

      - name: Mostrar ejecutables
        shell: pwsh
        run: |
          Get-ChildItem "$env:PROJECT_DIR" -Filter "*.exe" -Recurse -File |
            ForEach-Object { Write-Host $_.FullName }

      - name: Subir compilacion
        uses: actions/upload-artifact@v4
        with:
          name: windowsBuild
          path: |
            **/export/release/windows/bin/**
            export/release/windows/bin/**
          if-no-files-found: error
          retention-days: 7
