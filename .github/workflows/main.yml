name: Build Psych Engine 0.7.3 Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Instalar Haxe
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: '4.2.5'

      - name: Configurar Haxelib
        shell: cmd
        run: haxelib setup C:\haxelib

      - name: Instalar dependencias Haxe
        shell: cmd
        run: |
          haxelib install hxcpp
          haxelib install lime
          haxelib install openfl

      - name: Compilar Psych Engine
        shell: cmd
        run: haxelib run lime build windows -64

      - name: Comprobar archivos compilados
        shell: pwsh
        run: |
          $path = "export/release/windows/bin"
          if (!(Test-Path $path)) {
            Get-ChildItem export -Recurse -Filter "*.exe" -ErrorAction SilentlyContinue
            throw "No se encontro la carpeta esperada de compilacion."
          }
          Get-ChildItem $path -Recurse

      - name: Subir compilacion
        uses: actions/upload-artifact@v4
        with:
          name: PsychEngine-0.7.3-Windows-x64
          path: export/release/windows/bin/
          if-no-files-found: error
          retention-days: 7
