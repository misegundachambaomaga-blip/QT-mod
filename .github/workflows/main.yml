name: Build Psych Engine 0.7.3 Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Instalar Haxe
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: '4.2.5'

      - name: Configurar Haxelib
        shell: cmd
        run: haxelib setup C:\haxelib

      - name: Instalar dependencias
        shell: pwsh
        run: |
          haxelib install lime
          haxelib install openfl
          haxelib install flixel
          haxelib install flixel-addons
          haxelib install flixel-ui
          haxelib install hscript
          haxelib install hxcpp
          haxelib install linc_luajit
          haxelib install discord_rpc

      - name: Instalar Lime
        shell: pwsh
        run: haxelib run lime setup -y

      - name: Buscar Project.xml
        id: project
        shell: pwsh
        run: |
          $file = Get-ChildItem . -Filter Project.xml -Recurse -File |
            Where-Object { $_.FullName -notmatch '\\(\.git|node_modules)\\' } |
            Select-Object -First 1

          if (-not $file) {
            throw "No se encontro Project.xml"
          }

          "PROJECT_DIR=$($file.Directory.FullName)" >> $env:GITHUB_ENV
          Write-Host "Proyecto: $($file.FullName)"

      - name: Compilar Windows x64
        shell: pwsh
        working-directory: ${{ env.PROJECT_DIR }}
        run: haxelib run lime build windows -64

      - name: Buscar ejecutable
        shell: pwsh
        run: |
          $files = Get-ChildItem . -Filter *.exe -Recurse -File |
            Where-Object { $_.FullName -notmatch '\\(\.git|node_modules)\\' }

          if (-not $files) {
            throw "No se encontro ningun EXE compilado"
          }

          $files | ForEach-Object { Write-Host $_.FullName }

      - name: Subir compilacion
        uses: actions/upload-artifact@v4
        with:
          name: PsychEngine-0.7.3-Windows-x64
          path: |
            **/*.exe
            **/*.dll
            **/assets/**
            **/mods/**
          if-no-files-found: error
          retention-days: 7
