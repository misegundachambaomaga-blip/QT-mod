name: Build Psych Engine Windows

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  buildWindows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Haxe
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: '4.2.5'

      - name: Find Psych Engine Project.xml
        id: project
        shell: pwsh
        run: |
          $project = Join-Path $env:GITHUB_WORKSPACE "PSYCH ENGINE/FNF-PsychEngine-main/Project.xml"

          if (!(Test-Path $project)) {
            Write-Host "No se encontro el archivo esperado."
            Get-ChildItem $env:GITHUB_WORKSPACE -Force
            throw "Project.xml no encontrado en la ruta indicada."
          }

          "PROJECT_FILE=$project" >> $env:GITHUB_ENV
          "PROJECT_DIR=$(Split-Path $project)" >> $env:GITHUB_ENV
          Write-Host "Proyecto encontrado: $project"

      - name: Configure Haxelib
        shell: cmd
        run: haxelib setup C:/haxelib

      - name: Install dependencies
        shell: cmd
        run: |
          haxelib install hxcpp
          haxelib install lime
          haxelib install openfl
          haxelib install flixel
          haxelib install flixel-tools
          haxelib install flixel-ui
          haxelib install flixel-addons
          haxelib install hscript
          haxelib install tjson
          haxelib install hxjsonast
          haxelib install newgrounds
          haxelib git polymod https://github.com/larsiusprime/polymod.git
          haxelib git linc_luajit https://github.com/AndreiRudenko/linc_luajit
          haxelib git hscript-ex https://github.com/ianharrigan/hscript-ex
          haxelib git discord_rpc https://github.com/Aidan63/linc_discord-rpc
          haxelib install hxcpp-debug-server
          haxelib run lime setup -y
          haxelib list

      - name: Create version
        shell: pwsh
        run: '"${{ github.run_id }}" | Set-Content "$env:PROJECT_DIR/VERSION"'

      - name: Compile Psych Engine Windows x64
        shell: pwsh
        run: |
          Set-Location "$env:PROJECT_DIR"
          haxelib run lime build "$env:PROJECT_FILE" windows -64 --app-version="0.2.7-${{ github.run_id }}"

          if ($LASTEXITCODE -ne 0) {
            throw "La compilacion de Psych Engine fallo."
          }

      - name: Verify executable
        shell: pwsh
        run: |
          $output = Join-Path $env:PROJECT_DIR "export/release/windows/bin"
          $exe = Get-ChildItem $output -Filter "*.exe" -Recurse -File -ErrorAction SilentlyContinue

          if (!$exe) {
            throw "No se encontro ningun EXE en $output"
          }

          $exe | ForEach-Object { Write-Host $_.FullName }

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: PsychEngine-Windows-x64
          path: |
            PSYCH ENGINE/FNF-PsychEngine-main/export/release/windows/bin/**
          if-no-files-found: error
          retention-days: 7
